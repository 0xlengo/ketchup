# ==========================================================================
# CRE WORKFLOW SETTINGS FILE
# ==========================================================================
# Workflow-specific settings for CRE CLI targets.
# Each target defines user-workflow and workflow-artifacts groups.
# Settings here override CRE Project Settings File values.

# ==========================================================================
staging-settings:
  user-workflow:
    workflow-name: "defi-risk-oracle-staging"
  workflow-artifacts:
    workflow-path: "./risk-evaluator.ts"
    config-path: "./config.json"
    secrets-path: ""

# ==========================================================================
production-settings:
  user-workflow:
    workflow-name: "defi-risk-oracle-production"
  workflow-artifacts:
    workflow-path: "./risk-evaluator.ts"
    config-path: "./config.json"
    secrets-path: ""

